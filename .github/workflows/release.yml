name: Release

# Push a tag such as v1.0.0 to build both apps and publish a GitHub Release.
# "Run workflow" from the Actions tab builds both and attaches them to the run
# as artifacts without publishing anything, which is the way to test this.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    name: Build macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test
        working-directory: apps/macos

      - name: Validate shared native protocol vector
        run: swift ../../tools/validate_protocol_vector.swift
        working-directory: apps/macos

      - name: Build DMG
        run: tools/make_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SideCursor-macOS
          path: dist/SideCursor-macOS.dmg

  windows:
    name: Build Windows zip
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: dotnet test .\apps\windows\SideCursor.Windows.Tests\SideCursor.Windows.Tests.csproj --configuration Release

      - name: Publish self-contained build
        run: .\tools\build_windows.ps1 -SelfContained

      - name: Package zip
        shell: pwsh
        run: |
          Remove-Item dist\windows\*.pdb -ErrorAction SilentlyContinue
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, README.md dist\windows\
          Compress-Archive -Path dist\windows\* -DestinationPath dist\SideCursor-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SideCursor-Windows
          path: dist/SideCursor-Windows.zip

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/SideCursor-macOS.dmg dist/SideCursor-Windows.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "SideCursor $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Mac: Apple Silicon, macOS 13 or later. Windows: 64-bit Windows 10 (2004) or later. Neither app is signed with a developer certificate: on macOS right-click the app and choose Open; on Windows choose More info, then Run anyway. See the README for setup."
